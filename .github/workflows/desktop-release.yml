name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable npm release
        run: npm install --global npm@10.8.2

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify build tools
        run: node -e "console.log(require.resolve('tsx')); console.log(require.resolve('electron-builder/cli.js'))"

      - name: Build web and server assets
        run: node --import tsx script/build.ts

      - name: Build desktop package
        run: node node_modules/electron-builder/cli.js --${{ matrix.platform }} --publish never

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartpanel-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true